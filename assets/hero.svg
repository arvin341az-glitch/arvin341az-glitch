<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#39d5ff"/><stop offset=".52" stop-color="#7c7cff"/><stop offset="1" stop-color="#f05cff"/></linearGradient>
  <linearGradient id="gw" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#39d5ff" stop-opacity="0"/><stop offset=".5" stop-color="#39d5ff" stop-opacity=".8"/><stop offset="1" stop-color="#c65cff" stop-opacity="0"/></linearGradient>
  <radialGradient id="bg"><stop stop-color="#132b4d" stop-opacity=".75"/><stop offset="1" stop-color="#050912" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="7"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2.5"/></filter>
  <clipPath id="c1"><rect x="70" y="70" width="300" height="72"/></clipPath>
  <clipPath id="c2"><rect x="830" y="82" width="290" height="82"/></clipPath>
</defs>
<rect width="1200" height="360" fill="#050912"/>
<ellipse cx="600" cy="165" rx="560" ry="270" fill="url(#bg)"/>
<path d="M0 42H1200M0 318H1200" stroke="#13223a"/>
<g opacity=".7" stroke="#14233a" stroke-width="1"><path d="M0 90H1200M0 180H1200M0 270H1200"/><path d="M150 0V360M300 0V360M450 0V360M750 0V360M900 0V360M1050 0V360"/></g>

<!-- living code -->
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#4e7599" clip-path="url(#c1)">
 <text x="70" y="82">const signal = await edge.connect()</text>
 <text x="70" y="101" fill="#42647f">for (const node of network) {</text>
 <text x="70" y="120" fill="#6a76b7">  node.sync({ mode: 'realtime' })</text>
 <text x="70" y="139" fill="#42647f">}</text>
 <rect x="70" y="62" width="0" height="90" fill="#07101d"><animate attributeName="width" values="0;300;300;0;0" keyTimes="0;.25;.55;.8;1" dur="8s" repeatCount="indefinite"/></rect>
</g>
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="12" fill="#4e7599" clip-path="url(#c2)">
 <text x="830" y="96" fill="#5f6fae">async function deploy() {</text>
 <text x="830" y="115">  await build('rvg')</text>
 <text x="830" y="134" fill="#6b7fa0">  return gateway.ready()</text>
 <text x="830" y="153" fill="#5f6fae">}</text>
 <rect x="830" y="76" width="0" height="100" fill="#07101d"><animate attributeName="width" values="0;290;290;0;0" keyTimes="0;.25;.55;.8;1" dur="8s" begin="2.2s" repeatCount="indefinite"/></rect>
</g>

<!-- moving wave particles -->
<g fill="none" stroke="url(#gw)" stroke-width="1.4" opacity=".65">
 <path d="M-60 258 C110 180 210 335 390 250 S670 170 850 255 S1090 335 1260 230"/>
 <path d="M-60 274 C120 196 220 348 400 266 S680 188 860 270 S1090 348 1260 244" opacity=".45"/>
</g>
<g fill="#43d9ff">
 <circle r="2.5"><animateMotion dur="7s" repeatCount="indefinite" path="M-60 258 C110 180 210 335 390 250 S670 170 850 255 S1090 335 1260 230"/></circle>
 <circle r="1.8" opacity=".7"><animateMotion dur="5.8s" begin="-2s" repeatCount="indefinite" path="M-60 274 C120 196 220 348 400 266 S680 188 860 270 S1090 348 1260 244"/></circle>
 <circle r="2.2" fill="#bb6cff"><animateMotion dur="8.5s" begin="-4s" repeatCount="indefinite" path="M-60 258 C110 180 210 335 390 250 S670 170 850 255 S1090 335 1260 230"/></circle>
 <circle r="1.4" opacity=".6"><animateMotion dur="6.4s" begin="-1s" repeatCount="indefinite" path="M-60 274 C120 196 220 348 400 266 S680 188 860 270 S1090 348 1260 244"/></circle>
</g>
<g fill="#59dcff" opacity=".75">
 <circle cx="90" cy="245" r="1.8"><animate attributeName="cy" values="245;235;245" dur="2.2s" repeatCount="indefinite"/></circle><circle cx="180" cy="286" r="1.4"><animate attributeName="opacity" values=".2;1;.2" dur="1.8s" repeatCount="indefinite"/></circle><circle cx="1040" cy="248" r="1.8"><animate attributeName="cy" values="248;238;248" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="1130" cy="286" r="1.5"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle>
</g>

<!-- central neon cube -->
<g transform="translate(600 164)">
 <path d="M-150 -82 L0 -122 L150 -82 L150 88 L0 126 L-150 88 Z" fill="#07101c" fill-opacity=".82" stroke="url(#g)" stroke-width="2"/>
 <path d="M-150 -82 L0 -28 L150 -82 M0 -28 V126 M-150 88 L0 34 L150 88" fill="none" stroke="#55d9ff" stroke-opacity=".55"/>
 <path d="M-124 -68 L0 -101 L124 -68 L124 69 L0 101 L-124 69 Z" fill="none" stroke="#7f8fff" stroke-opacity=".45"/>
 <path d="M-118 -66 L0 -95 L118 -66" fill="none" stroke="#ef6cff" stroke-opacity=".7"/>
 <text x="0" y="30" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="74" font-weight="800" letter-spacing="-4" fill="url(#g)">CB</text>
 <text x="0" y="58" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',Consolas,monospace" font-size="10" letter-spacing="4" fill="#7e9bc4">CODE BOX</text>
 <path d="M-175 -96L-188 -101M175 -96L188 -101M-175 101L-188 106M175 101L188 106" stroke="#48d9ff"/>
</g>

<!-- foreground labels -->
<g font-family="'JetBrains Mono','Fira Code',Consolas,monospace">
 <text x="34" y="31" font-size="11" fill="#3e5d7c">~/arvin/profile</text>
 <text x="1166" y="31" text-anchor="end" font-size="11" fill="#3e5d7c">LIVE / SVG</text>
 <text x="600" y="310" text-anchor="middle" font-size="23" font-weight="700" letter-spacing="8" fill="url(#g)">CODE BOX</text>
 <text x="600" y="332" text-anchor="middle" font-size="10" letter-spacing="4" fill="#587394">PROGRAMMING · CREATIVE CODING · INFRASTRUCTURE</text>
</g>
